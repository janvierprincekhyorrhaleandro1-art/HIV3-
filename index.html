<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEX TERMINAL | High-Precision MT5 Execution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              blackPure: '#000000',
              cardDark: '#0A0A0A',
              cardBorder: '#1F2937',
              tradeBuy: '#10B981',
              tradeSell: '#EF4444',
              neonGreen: '#00FF66',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: #FFFFFF;
        overflow-x: hidden;
      }

      /* CANVAS BACKGROUND GRAPHIC */
      #chartCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
        opacity: 0.25;
      }

      .dark-card {
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .dark-card:hover {
        border-color: #10B981;
      }

      .copy-btn:active {
        transform: scale(0.90);
      }

      /* TOAST ANIMATION */
      @keyframes slideIn {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .toast-enter {
        animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
</head>
<body class="text-white font-sans min-h-screen p-3 md:p-6 antialiased selection:bg-emerald-500 selection:text-black">

    <!-- DYNAMIC LIVE GRAPHIC BACKGROUND CANVAS -->
    <canvas id="chartCanvas"></canvas>

    <!-- HEADER (COMPACT) -->
    <header class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-4 mb-5 border-b border-white/10 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 bg-emerald-500 rounded-xl flex items-center justify-center font-black text-lg text-black font-mono shadow-lg shadow-emerald-500/20">
                FX
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl md:text-2xl font-black tracking-tight text-white font-mono">TRADEX<span class="text-emerald-400"> TERMINAL</span></h1>
                    <span class="text-[9px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded uppercase font-bold">MT5 Live</span>
                </div>
                <p class="text-[11px] text-slate-300">High-Precision Algo-Execution Feed</p>
            </div>
        </div>

        <div class="flex items-center gap-2 font-mono text-[11px]">
            <button onclick="requestNotificationPermission()" id="notify-btn" class="dark-card px-3 py-1 rounded-lg text-emerald-400 hover:bg-emerald-500/10 border-emerald-500/30 flex items-center gap-1.5 transition-all">
                🔔 Notifikasyon Chrome
            </button>
            <span class="dark-card px-2.5 py-1 rounded-lg text-white border-white/10">
                Siyal Aktif: <strong id="active-count" class="text-emerald-400">0</strong>
            </span>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto space-y-5">

        <!-- CONTROL PANEL -->
        <section class="dark-card p-4 rounded-2xl border-white/10">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 mb-3">
                <div class="flex items-center gap-3">
                    <h2 class="text-sm font-bold text-white font-mono flex items-center gap-2">
                        <span>🤖</span> AI SCANNER AUTOMATION
                    </h2>
                    <div class="flex items-center bg-black border border-white/10 rounded-lg p-0.5 font-mono text-[11px]">
                        <button id="tf-m5" onclick="selectTimeframe('5min')" class="px-2.5 py-1 rounded-md font-bold bg-emerald-500 text-black transition-all">M5</button>
                        <button id="tf-m1" onclick="selectTimeframe('1min')" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition-all">M1</button>
                    </div>
                </div>
                <div id="scan-status" class="hidden font-mono text-[11px] text-emerald-400 bg-emerald-950/40 border border-emerald-500/40 px-3 py-1 rounded-lg animate-pulse flex items-center gap-2">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-ping"></span> Ap analize done mache a...
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button onclick="triggerAnalysis('XAUUSD')" class="p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 border border-white/10 hover:border-emerald-500/50 text-white hover:text-emerald-400 font-mono text-xs font-bold transition-all flex items-center justify-between active:scale-95">
                    <span class="flex items-center gap-2">✨ Scan XAUUSD (Lò)</span>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold font-mono uppercase" id="badge-xau">M5</span>
                </button>

                <button onclick="triggerAnalysis('EURUSD')" class="p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 border border-white/10 hover:border-emerald-500/50 text-white hover:text-emerald-400 font-mono text-xs font-bold transition-all flex items-center justify-between active:scale-95">
                    <span class="flex items-center gap-2">💱 Scan EUR/USD</span>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold font-mono uppercase" id="badge-eur">M5</span>
                </button>

                <button onclick="triggerAnalysis('GBPUSD')" class="p-3 rounded-xl bg-white/5 hover:bg-emerald-500/10 border border-white/10 hover:border-emerald-500/50 text-white hover:text-emerald-400 font-mono text-xs font-bold transition-all flex items-center justify-between active:scale-95">
                    <span class="flex items-center gap-2">💱 Scan GBP/USD</span>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold font-mono uppercase" id="badge-gbp">M5</span>
                </button>
            </div>
        </section>

        <!-- ACTIVE SIGNALS GRID -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-white font-mono flex items-center gap-2">
                    <span class="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span> SIYAL AN KOUPYAP (MT5 EXECUTION)
                </h2>
                <span class="text-[10px] font-mono text-slate-400">Auto Expiry Active</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5" id="active-signals">
                <!-- Siyal yo ap monte la ak JavaScript -->
            </div>
        </section>

    </main>

    <!-- CUSTOM TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zffrlogicrwjkjrrbdik.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZnJsb2dpY3J3amtqcnJiZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxOTYzMjEsImV4cCI6MjEwMjc3MjMyMX0.6YSppM6viAaGZrG_PC9HPm8zFxmuP_4a5NoWpdNT4d0';              
        const RENDER_SERVER_URL = 'https://hiv3-trading-bot.onrender.com';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedInterval = '5min';

        // 1. ANIMATION GRAPHIC CANVAS (BACKGROUND)
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let points = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initPoints();
        }

        function initPoints() {
            points = [];
            let count = Math.floor(width / 40);
            let currentY = height / 2;
            for (let i = 0; i <= count; i++) {
                currentY += (Math.random() - 0.5) * 60;
                if (currentY < 100) currentY = 150;
                if (currentY > height - 100) currentY = height - 150;
                points.push({ x: i * 40, y: currentY, speed: (Math.random() - 0.5) * 0.8 });
            }
        }

        function drawChart() {
            ctx.clearRect(0, 0, width, height);

            ctx.beginPath();
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 1.5;

            for (let i = 0; i < points.length; i++) {
                points[i].y += points[i].speed;
                if (Math.random() < 0.02) points[i].speed = (Math.random() - 0.5) * 0.8;

                if (i === 0) ctx.moveTo(points[i].x, points[i].y);
                else ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();

            // Draw glowing points and Candlestick lines
            for (let i = 0; i < points.length; i += 2) {
                ctx.fillStyle = i % 4 === 0 ? '#10B981' : '#EF4444';
                ctx.fillRect(points[i].x - 2, points[i].y - 12, 4, 24);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(points[i].x - 1, points[i].y - 20, 2, 40);
            }

            requestAnimationFrame(drawChart);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawChart();

        // 2. CHROME NOTIFICATION SYSTEM
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        showToast("SUCCESS", "🔔 Notifikasyon Chrome aktive ak siksè!");
                    } else {
                        showToast("ERROR", "⚠️ Ou bloke notifikasyon yo nan browser a.");
                    }
                });
            }
        }

        function sendBrowserNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: 'https://cdn-icons-png.flaticon.com/512/2586/2586144.png'
                });
            }
        }

        // 3. CUSTOM THEMED TOAST POP-UP
        function showToast(type, message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const isSuccess = type === 'SUCCESS';
            const borderColor = isSuccess ? 'border-emerald-500' : 'border-slate-500';
            const badgeBg = isSuccess ? 'bg-emerald-500 text-black' : 'bg-slate-700 text-white';

            toast.className = `toast-enter pointer-events-auto dark-card p-4 rounded-xl border ${borderColor} shadow-2xl flex items-center gap-3 text-xs font-mono`;
            toast.innerHTML = `
                <span class="px-2 py-1 rounded font-bold text-[10px] ${badgeBg}">${isSuccess ? 'SIYAL' : 'INFO'}</span>
                <span class="text-white flex-1">${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        function selectTimeframe(tf) {
            selectedInterval = tf;
            const m5Btn = document.getElementById('tf-m5');
            const m1Btn = document.getElementById('tf-m1');
            const label = tf === '5min' ? 'M5' : 'M1';

            document.getElementById('badge-xau').innerText = label;
            document.getElementById('badge-eur').innerText = label;
            document.getElementById('badge-gbp').innerText = label;

            if (tf === '5min') {
                m5Btn.className = "px-2.5 py-1 rounded-md font-bold bg-emerald-500 text-black transition-all";
                m1Btn.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition-all";
            } else {
                m1Btn.className = "px-2.5 py-1 rounded-md font-bold bg-emerald-500 text-black transition-all";
                m5Btn.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition-all";
            }
        }

        function copyToClipboard(text, btnId) {
            navigator.clipboard.writeText(text);
            const btn = document.getElementById(btnId);
            if (btn) {
                const originalText = btn.innerText;
                btn.innerText = '✔ OK';
                btn.classList.add('text-emerald-400');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('text-emerald-400');
                }, 1000);
            }
        }

        async function triggerAnalysis(symbol) {
            const statusEl = document.getElementById('scan-status');
            if (statusEl) statusEl.classList.remove('hidden');

            try {
                const response = await fetch(`${RENDER_SERVER_URL}/api/analyze/${symbol}?interval=${selectedInterval}`);
                const result = await response.json();
                
                if (result && result.signal) {
                    showToast('SUCCESS', `🎯 Nouvo siyal detekte sou ${symbol}: ${result.signal.type}!`);
                } else if (result && result.message) {
                    showToast('INFO', `ℹ️ ${result.message}`);
                } else if (result && result.error) {
                    showToast('ERROR', `❌ Erè: ${result.error}`);
                }
            } catch (error) {
                console.error("Erè:", error);
                showToast('ERROR', "⚠️ Echèk nan koneksyon ak sèvè Render a.");
            } finally {
                if (statusEl) statusEl.classList.add('hidden');
            }
        }

        async function loadActiveSignals() {
            const { data: signals, error } = await supabaseClient
                .from('signals')
                .select('*')
                .eq('status', 'ACTIVE')
                .order('created_at', { ascending: false });

            if (!error && signals) {
                renderSignals(signals);
            }
        }

        function renderSignals(signals) {
            const container = document.getElementById('active-signals');
            const activeCount = document.getElementById('active-count');
            
            activeCount.innerText = signals.length;
            container.innerHTML = '';

            if (signals.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full dark-card p-8 rounded-2xl text-center text-slate-400 font-mono text-xs">
                        📡 Pa gen siyal ki valab an tan reyèl pou kounye a. Peze yon bouton anwo a pou fè yon analiz.
                    </div>
                `;
                return;
            }

            const now = new Date();

            signals.forEach((signal, idx) => {
                const isBuy = signal.type.toUpperCase() === 'BUY';
                const badgeClass = isBuy ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-red-500/20 text-red-400 border-red-500/40';
                
                const createdAt = new Date(signal.created_at || Date.now());
                const expiryTime = new Date(createdAt.getTime() + 15 * 60000);
                const isExpired = now > expiryTime;

                const cardHtml = `
                    <div class="dark-card rounded-2xl p-3.5 relative border ${isExpired ? 'opacity-40 border-slate-800' : (isBuy ? 'border-emerald-500/40' : 'border-red-500/40')}">
                        
                        <div class="flex justify-between items-center mb-2 pb-2 border-b border-white/10">
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <h3 class="text-base font-black text-white font-mono">${signal.pair}</h3>
                                    <button onclick="copyToClipboard('${signal.pair}', 'cp-p-${idx}')" id="cp-p-${idx}" class="copy-btn text-[9px] font-mono bg-black border border-white/20 text-white px-1 py-0.5 rounded">📋</button>
                                </div>
                                <span class="text-[10px] font-mono text-slate-400">Timeframe: <strong class="text-white">${signal.timeframe || '5m'}</strong></span>
                            </div>
                            
                            <div class="text-right">
                                <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded border uppercase ${badgeClass}">
                                    ${signal.type}
                                </span>
                                <div class="text-[9px] font-mono mt-1 ${isExpired ? 'text-red-400 font-bold' : 'text-emerald-400'}">
                                    ${isExpired ? '⛔ EKSPİRE' : '⏳ Valid: ~15mn'}
                                </div>
                            </div>
                        </div>

                        <div class="space-y-1.5 font-mono text-xs bg-black/90 p-2.5 rounded-xl border border-white/10 mb-2.5">
                            
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400 text-[11px]">Entry Price:</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-white">${signal.entry_price}</span>
                                    <button onclick="copyToClipboard('${signal.entry_price}', 'cp-ep-${idx}')" id="cp-ep-${idx}" class="copy-btn text-[9px] text-slate-400">📋</button>
                                </div>
                            </div>

                            <div class="flex justify-between items-center">
                                <span class="text-slate-400 text-[11px]">TP1 (Profit):</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-emerald-400">${signal.tp1}</span>
                                    <button onclick="copyToClipboard('${signal.tp1}', 'cp-tp1-${idx}')" id="cp-tp1-${idx}" class="copy-btn text-[9px] text-slate-400">📋</button>
                                </div>
                            </div>

                            ${signal.tp2 ? `
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400 text-[11px]">TP2 (Runner):</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-emerald-300">${signal.tp2}</span>
                                    <button onclick="copyToClipboard('${signal.tp2}', 'cp-tp2-${idx}')" id="cp-tp2-${idx}" class="copy-btn text-[9px] text-slate-400">📋</button>
                                </div>
                            </div>` : ''}

                            <div class="flex justify-between items-center pt-1 border-t border-white/10">
                                <span class="text-slate-400 text-[11px]">Stop Loss:</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-red-400">${signal.sl}</span>
                                    <button onclick="copyToClipboard('${signal.sl}', 'cp-sl-${idx}')" id="cp-sl-${idx}" class="copy-btn text-[9px] text-slate-400">📋</button>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-[10px] font-mono text-slate-400">
                            <span>Risk/Reward: <strong class="text-white">${signal.risk_reward || '1:2'}</strong></span>
                            <span class="text-[9px] bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-1.5 py-0.5 rounded">Lot: 0.01 - 0.05</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // REALTIME LISTENER AK NOTIFIKATION CHROME
        supabaseClient
            .channel('public:signals')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'signals' }, payload => {
                const newSignal = payload.new;
                sendBrowserNotification(
                    `🚨 NOUVO SIYAL MT5: ${newSignal.pair} (${newSignal.type})`,
                    `Pri Antre: ${newSignal.entry_price} | TP: ${newSignal.tp1} | SL: ${newSignal.sl}`
                );
                showToast('SUCCESS', `🚨 NOUVO SIYAL: ${newSignal.pair} (${newSignal.type})`);
                loadActiveSignals();
            })
            .subscribe();

        loadActiveSignals();
    </script>
</body>
</html>
