<!DOCTYPE html>
<html lang="ht" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADEX TERMINAL | High-Precision MT5 Execution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              blackPure: '#000000',
              cardDark: '#0A0A0A',
              cardBorder: '#1F1F1F',
              tradeBuy: '#10B981',
              tradeSell: '#EF4444',
              goldAccent: '#F59E0B',
              neonCyan: '#06B6D4'
            }
          }
        }
      }
    </script>
    <style>
      /* 100% PURE BLACK BACKGROUND WITH FINE GRID */
      body {
        background-color: #000000;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
        background-attachment: fixed;
      }

      .dark-card {
        background: #0A0A0A;
        border: 1px solid #1F1F1F;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      .dark-card:hover {
        border-color: #333333;
      }

      .copy-btn:active {
        transform: scale(0.92);
      }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen p-3 md:p-6 antialiased selection:bg-amber-500 selection:text-black">

    <!-- HEADER (COMPACT) -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-4 mb-5 border-b border-zinc-800 max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 bg-amber-500 rounded-xl flex items-center justify-center font-black text-lg text-black font-mono shadow-md">
                FX
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl md:text-2xl font-black tracking-tight text-white font-mono">TRADEX<span class="text-amber-500"> TERMINAL</span></h1>
                    <span class="text-[9px] font-mono bg-zinc-900 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded uppercase font-bold">MT5 Live</span>
                </div>
                <p class="text-[11px] text-zinc-400">High-Precision Execution Feed</p>
            </div>
        </div>

        <!-- SESSIONS & SCANNER METRICS -->
        <div class="flex items-center gap-2 font-mono text-[11px]">
            <span class="dark-card px-2.5 py-1 rounded-lg text-zinc-400 flex items-center gap-1.5">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-ping"></span> Live Market
            </span>
            <span class="dark-card px-2.5 py-1 rounded-lg text-amber-400 border-amber-500/20">
                Siyal Aktif: <strong id="active-count" class="text-white">0</strong>
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-5">

        <!-- CONTROL PANEL (COMPACT TIMEFRAME SELECTOR & SCANNER) -->
        <section class="dark-card p-4 rounded-2xl border-zinc-800">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 mb-3">
                <div class="flex items-center gap-3">
                    <h2 class="text-sm font-bold text-white font-mono flex items-center gap-2">
                        <span>🤖</span> SCANNER AUTOMATION
                    </h2>
                    <!-- TIMEFRAME SELECTOR OPTION -->
                    <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg p-0.5 font-mono text-[11px]">
                        <button id="tf-m5" onclick="selectTimeframe('5min')" class="px-2.5 py-1 rounded-md font-bold bg-amber-500 text-black transition-all">M5 (Rekòmande)</button>
                        <button id="tf-m1" onclick="selectTimeframe('1min')" class="px-2.5 py-1 rounded-md text-zinc-400 hover:text-white transition-all">M1</button>
                    </div>
                </div>
                <div id="scan-status" class="hidden font-mono text-[11px] text-amber-400 bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-lg animate-pulse flex items-center gap-2">
                    <span class="h-1.5 w-1.5 rounded-full bg-amber-400 animate-ping"></span> Ap analize mache a...
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button onclick="triggerAnalysis('XAUUSD')" class="p-3 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 font-mono text-xs font-bold transition-all flex items-center justify-between active:scale-95">
                    <span class="flex items-center gap-2">✨ Scan XAUUSD (Lò)</span>
                    <span class="text-[10px] bg-amber-500/20 px-2 py-0.5 rounded text-amber-300 font-bold font-mono uppercase" id="badge-xau">M5</span>
                </button>

                <button onclick="triggerAnalysis('EURUSD')" class="p-3 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 text-blue-400 font-mono text-xs font-bold transition-all flex items-center justify-between active:scale-95">
                    <span class="flex items-center gap-2">💱 Scan EUR/USD</span>
                    <span class="text-[10px] bg-blue-500/20 px-2 py-0.5 rounded text-blue-300 font-bold font-mono uppercase" id="badge-eur">M5</span>
                </button>

                <button onclick="triggerAnalysis('GBPUSD')" class="p-3 rounded-xl bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 text-blue-400 font-mono text-xs font-bold transition-all flex items-center justify-between active:scale-95">
                    <span class="flex items-center gap-2">💱 Scan GBP/USD</span>
                    <span class="text-[10px] bg-blue-500/20 px-2 py-0.5 rounded text-blue-300 font-bold font-mono uppercase" id="badge-gbp">M5</span>
                </button>
            </div>
        </section>

        <!-- ACTIVE SIGNALS GRID (COMPACT 3/4 COLUMNS) -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-white font-mono flex items-center gap-2">
                    <span class="h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span> SIYAL AN KOUPYAP (MT5 EXECUTION)
                </h2>
                <span class="text-[10px] font-mono text-zinc-500">Auto Expiry System Active</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5" id="active-signals">
                <!-- Siyal yo ap mete la otomatikman -->
            </div>
        </section>

    </main>

    <!-- SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zffrlogicrwjkjrrbdik.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZnJsb2dpY3J3amtqcnJiZGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxOTYzMjEsImV4cCI6MjEwMjc3MjMyMX0.6YSppM6viAaGZrG_PC9HPm8zFxmuP_4a5NoWpdNT4d0';              
        const RENDER_SERVER_URL = 'https://hiv3-trading-bot.onrender.com';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedInterval = '5min';

        function selectTimeframe(tf) {
            selectedInterval = tf;
            const m5Btn = document.getElementById('tf-m5');
            const m1Btn = document.getElementById('tf-m1');
            const label = tf === '5min' ? 'M5' : 'M1';

            document.getElementById('badge-xau').innerText = label;
            document.getElementById('badge-eur').innerText = label;
            document.getElementById('badge-gbp').innerText = label;

            if (tf === '5min') {
                m5Btn.className = "px-2.5 py-1 rounded-md font-bold bg-amber-500 text-black transition-all";
                m1Btn.className = "px-2.5 py-1 rounded-md text-zinc-400 hover:text-white transition-all";
            } else {
                m1Btn.className = "px-2.5 py-1 rounded-md font-bold bg-amber-500 text-black transition-all";
                m5Btn.className = "px-2.5 py-1 rounded-md text-zinc-400 hover:text-white transition-all";
            }
        }

        function copyToClipboard(text, btnId) {
            navigator.clipboard.writeText(text);
            const btn = document.getElementById(btnId);
            if (btn) {
                const originalText = btn.innerText;
                btn.innerText = '✔ OK';
                btn.classList.add('text-emerald-400');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('text-emerald-400');
                }, 1000);
            }
        }

        async function triggerAnalysis(symbol) {
            const statusEl = document.getElementById('scan-status');
            if (statusEl) statusEl.classList.remove('hidden');

            try {
                const response = await fetch(`${RENDER_SERVER_URL}/api/analyze/${symbol}?interval=${selectedInterval}`);
                const result = await response.json();
                
                if (result && result.message) {
                    alert("🤖 " + result.message);
                } else if (result && result.error) {
                    alert("❌ Erè nan sèvè a: " + result.error);
                }
            } catch (error) {
                console.error("Erè:", error);
                alert("⚠️ Echèk nan koneksyon ak sèvè a.");
            } finally {
                if (statusEl) statusEl.classList.add('hidden');
            }
        }

        async function loadActiveSignals() {
            const { data: signals, error } = await supabaseClient
                .from('signals')
                .select('*')
                .eq('status', 'ACTIVE')
                .order('created_at', { ascending: false });

            if (!error && signals) {
                renderSignals(signals);
            }
        }

        function renderSignals(signals) {
            const container = document.getElementById('active-signals');
            const activeCount = document.getElementById('active-count');
            
            activeCount.innerText = signals.length;
            container.innerHTML = '';

            if (signals.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full dark-card p-8 rounded-2xl text-center text-zinc-500 font-mono text-xs">
                        📡 Pa gen siyal ki valab sou mache a pou kounye a. Peze yon bouton anwo a pou fè yon analiz.
                    </div>
                `;
                return;
            }

            const now = new Date();

            signals.forEach((signal, idx) => {
                const isBuy = signal.type.toUpperCase() === 'BUY';
                const badgeClass = isBuy ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-red-500/20 text-red-400 border-red-500/40';
                
                // KALKILE EKSPIYASYON (Si siyal la te kreye depi plis pase 15 minit li konsidere kòm EXPIRED)
                const createdAt = new Date(signal.created_at || Date.now());
                const expiryTime = new Date(createdAt.getTime() + 15 * 60000); // 15 Min Validite
                const isExpired = now > expiryTime;

                const cardHtml = `
                    <div class="dark-card rounded-2xl p-3.5 relative border ${isExpired ? 'opacity-40 border-zinc-800' : (isBuy ? 'border-emerald-500/30' : 'border-red-500/30')}">
                        
                        <!-- HEADER PAIR & TYPE -->
                        <div class="flex justify-between items-center mb-2 pb-2 border-b border-zinc-800/80">
                            <div>
                                <div class="flex items-center gap-1.5">
                                    <h3 class="text-base font-black text-white font-mono">${signal.pair}</h3>
                                    <button onclick="copyToClipboard('${signal.pair}', 'cp-p-${idx}')" id="cp-p-${idx}" class="copy-btn text-[9px] font-mono bg-zinc-900 border border-zinc-700 text-zinc-300 px-1 py-0.5 rounded">📋</button>
                                </div>
                                <span class="text-[10px] font-mono text-zinc-500">Timeframe: <strong class="text-zinc-300">${signal.timeframe || '5m'}</strong></span>
                            </div>
                            
                            <div class="text-right">
                                <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded border uppercase ${badgeClass}">
                                    ${signal.type}
                                </span>
                                <!-- EXPIRE TIMER -->
                                <div class="text-[9px] font-mono mt-1 ${isExpired ? 'text-red-400 font-bold' : 'text-amber-400'}">
                                    ${isExpired ? '⛔ EKSPİRE (Pa antre)' : '⏳ Validite: ~15mn'}
                                </div>
                            </div>
                        </div>

                        <!-- PARAMÈT DETAYE POU METATRADER -->
                        <div class="space-y-1.5 font-mono text-xs bg-black p-2.5 rounded-xl border border-zinc-900 mb-2.5">
                            
                            <div class="flex justify-between items-center">
                                <span class="text-zinc-500 text-[11px]">Entry Price:</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-white">${signal.entry_price}</span>
                                    <button onclick="copyToClipboard('${signal.entry_price}', 'cp-ep-${idx}')" id="cp-ep-${idx}" class="copy-btn text-[9px] text-zinc-400">📋</button>
                                </div>
                            </div>

                            <div class="flex justify-between items-center">
                                <span class="text-zinc-500 text-[11px]">TP1 (Profit):</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-emerald-400">${signal.tp1}</span>
                                    <span class="text-[9px] text-emerald-600">(+${signal.tp1_pips || 100}p)</span>
                                    <button onclick="copyToClipboard('${signal.tp1}', 'cp-tp1-${idx}')" id="cp-tp1-${idx}" class="copy-btn text-[9px] text-zinc-400">📋</button>
                                </div>
                            </div>

                            ${signal.tp2 ? `
                            <div class="flex justify-between items-center">
                                <span class="text-zinc-500 text-[11px]">TP2 (Runner):</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-emerald-500">${signal.tp2}</span>
                                    <button onclick="copyToClipboard('${signal.tp2}', 'cp-tp2-${idx}')" id="cp-tp2-${idx}" class="copy-btn text-[9px] text-zinc-400">📋</button>
                                </div>
                            </div>` : ''}

                            <div class="flex justify-between items-center pt-1 border-t border-zinc-900">
                                <span class="text-zinc-500 text-[11px]">Stop Loss:</span>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-red-400">${signal.sl}</span>
                                    <span class="text-[9px] text-red-600">(-${signal.sl_pips || 100}p)</span>
                                    <button onclick="copyToClipboard('${signal.sl}', 'cp-sl-${idx}')" id="cp-sl-${idx}" class="copy-btn text-[9px] text-zinc-400">📋</button>
                                </div>
                            </div>
                        </div>

                        <!-- MT5 ACTION FOOTER -->
                        <div class="flex items-center justify-between text-[10px] font-mono text-zinc-400">
                            <span>Risk/Reward: <strong class="text-zinc-200">${signal.risk_reward || '1:2'}</strong></span>
                            <span class="text-[9px] bg-zinc-900 border border-zinc-800 text-zinc-300 px-1.5 py-0.5 rounded">Lot: 0.01 - 0.05</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // REALTIME LISTENER
        supabaseClient
            .channel('public:signals')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'signals' }, () => {
                loadActiveSignals();
            })
            .subscribe();

        loadActiveSignals();
    </script>
</body>
</html>
