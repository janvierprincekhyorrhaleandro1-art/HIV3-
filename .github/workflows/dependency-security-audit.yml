name: Dependency security audit
on:
  push:
    paths:
      - ".github/workflows/dependency-security-audit.yml"
      - "package.json"
      - "package-lock.json"
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and record initial audit
        run: |
          npm install --ignore-scripts
          npm audit --json > audit-before.json || true
          node -e "const r=require('./audit-before.json'); console.log('AUDIT BEFORE', JSON.stringify(r.metadata?.vulnerabilities)); for (const [n,v] of Object.entries(r.vulnerabilities||{})) console.log('BEFORE',n,v.severity,'fixAvailable='+JSON.stringify(v.fixAvailable),'via='+v.via.map(x=>typeof x==='string'?x:x.title).join('; '))"
      - name: Apply compatible fixes only
        run: |
          npm audit fix --ignore-scripts || true
          npm audit --json > audit-after.json || true
          node -e "const r=require('./audit-after.json'); console.log('AUDIT AFTER', JSON.stringify(r.metadata?.vulnerabilities)); for (const [n,v] of Object.entries(r.vulnerabilities||{})) console.log('AFTER',n,v.severity,'fixAvailable='+JSON.stringify(v.fixAvailable),'via='+v.via.map(x=>typeof x==='string'?x:x.title).join('; '))"
      - name: Commit lockfile if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add lockfile and apply compatible dependency security fixes"
            git push
          else
            echo "No lockfile changes to commit"
          fi
